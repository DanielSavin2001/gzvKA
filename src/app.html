<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<!--
			initial-scale=1 was missing, so a phone that had been zoomed on the previous page
			kept that zoom here. No maximum-scale and no user-scalable=no: pinch zoom is exactly
			what this audience uses on a photograph.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			No title element here on purpose.

			The placeholder below inserts the page's own title, and a hardcoded one here is
			not replaced - it is simply first. Every page carried two titles, and a crawler
			takes the first, so all 4,700 of them announced themselves as the generic site
			name regardless of what they were about.

			Do not write that placeholder's name anywhere else in this file, comments
			included: SvelteKit replaces the first occurrence it finds, so a mention of it in
			prose swallows the entire head into the prose and leaves the real one as text.
		-->

		%sveltekit.head%

		<!--
        Set the theme before anything paints.

        Every page here is prerendered, so the HTML is on screen before a single line of
        the app has run. Deciding the theme in a component - or even in `svelte:head`,
        which SvelteKit injects at the end of the head - means a white flash on every
        cold load for anyone using dark mode. This is small, blocking, and deliberate.

        `color-theme` is the key `src/lib/theme.ts` uses (inherited from the flowbite-svelte
        days), so nothing can disagree about where the answer is kept.
    -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('color-theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);

					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					// Storage blocked, or no matchMedia. Light is a fine place to land.
				}
			})();
		</script>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-paper-base text-gray-900 dark:bg-gray-900 dark:text-gray-100"
	>
		<div id="svelte" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
