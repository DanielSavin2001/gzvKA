<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Ge zijt van Kapellen als ge...</title>

		%sveltekit.head%

		<!--
        Set the theme before anything paints.

        Every page here is prerendered, so the HTML is on screen before a single line of
        the app has run. Deciding the theme in a component - or even in `svelte:head`,
        which SvelteKit injects at the end of the head - means a white flash on every
        cold load for anyone using dark mode. This is small, blocking, and deliberate.

        `color-theme` is the key `src/lib/theme.ts` uses, and the one flowbite-svelte's
        own toggle uses, so nothing can disagree about where the answer is kept.
    -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('color-theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);

					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					// Storage blocked, or no matchMedia. Light is a fine place to land.
				}
			})();
		</script>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100"
	>
		<div id="svelte" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
