name: Deploy to Firebase on merge

# Everything the project is made of, not just the website.
#
# This used to deploy hosting alone, which is a trap rather than a limitation: the frontend
# and the functions it calls ship together in one commit, so a hosting-only deploy puts a
# page live that calls an endpoint nobody has deployed. That is not theoretical - the admin
# page returned a 500 for a day because the fix for it was merged and only half deployed,
# and the other half needed somebody at a laptop with the Firebase CLI.
#
# So the backend goes first and the website second. If the functions fail, the old site is
# still up and still talking to the backend it was built against; a half-deploy in that
# direction breaks nothing.
#
# `workflow_dispatch` is here so a redeploy is a button in the GitHub app rather than a
# laptop: Actions -> this workflow -> "Run workflow", and pick what to send.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets:
        description: What to deploy
        type: choice
        default: everything
        options:
          - everything
          - hosting
          - backend

# One deploy at a time, and never cancelled half-way: interrupting a functions rollout
# leaves some of the twenty updated and the rest not.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Empty on a push, which means "everything" - the same as the dispatch default.
      TARGETS: ${{ github.event.inputs.targets || 'everything' }}
      PROJECT_ID: gzvka-12a9f
      # Pinned to a major version. An unpinned `npx firebase-tools` would silently pick up
      # a new major on some future Tuesday, and the first anyone would know of it is a
      # failed deploy of an unrelated change.
      FIREBASE_TOOLS: firebase-tools@13

    steps:
      - uses: actions/checkout@v4

      # The functions declare node 22, so the tests and the TypeScript build that gate this
      # deploy run on the version the functions will actually run on.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the deploy key is configured
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F is not set. See docs/deploy.md."
            exit 1
          fi

      - name: Set up environment variables
        run: |
          echo "VITE_BASE_URL_GF=${{ secrets.VITE_BASE_URL_GF_PROD || secrets.VITE_BASE_URL_GF_PRD }}" >> $GITHUB_ENV

          # The curator's page needs these three or it cannot even offer a sign-in button.
          # They are not secrets - Firebase publishes them in every client app - but they
          # are kept as repository secrets so the project can be pointed somewhere else
          # without a commit. Unset, the page says so plainly rather than half-working.
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> $GITHUB_ENV

      - run: npm ci
      - run: npm ci --prefix functions

      # The gates, and they run whatever is being deployed.
      #
      # Nothing used to check anything before a deploy, which was survivable while the
      # deploy was a static site: a broken page is visible and one revert away. It stops
      # being survivable the moment this workflow can replace twenty live functions, so a
      # red test now means nothing ships rather than something breaks.
      - name: Run the tests
        run: npm test --prefix functions

      - name: Check the types
        run: |
          # `svelte-kit sync` first, and not as a formality: it writes `.svelte-kit`, which
          # is generated rather than committed, and `svelte-check` run without it does not
          # fail - it hangs, which in a workflow means a job that sits there until the
          # six-hour limit rather than one that tells anybody what is wrong.
          npx svelte-kit sync
          npx svelte-check --threshold error

          # The functions' own TypeScript. The deploy compiles them anyway, but only when
          # functions are part of the deploy - and finding out here costs seconds where
          # finding out during the rollout costs a half-finished one.
          npm run build --prefix functions

      # The backend first. See the note at the top: this is the order that cannot leave a
      # page calling an endpoint that does not exist.
      #
      # `--force` lets the CLI remove a function that is no longer in `functions/src/index.ts`
      # without stopping to ask - the alternative in a workflow is a prompt nobody can
      # answer. It can only delete what a commit deleted: the source is typechecked and
      # tested above, and a function disappears from it only when somebody removes the
      # export.
      - name: Deploy functions, database rules, indexes and storage rules
        if: env.TARGETS != 'hosting'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F }}
        run: |
          # Written from an environment variable rather than interpolated into this script,
          # so the key never appears in a command line or a shell trace.
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"

          # `--package ... -- firebase` rather than `npx firebase-tools`: the package is
          # firebase-tools and the command it installs is `firebase`, and leaving npx to
          # infer that is a guess that costs a failed deploy when it stops holding.
          #
          # `firestore` is rules and indexes together, and `storage` is its rules. Spelled
          # as the plain target names rather than `storage:rules`, which reads as a NAMED
          # deploy target called "rules" - there is no such target in firebase.json, so the
          # CLI refuses the whole deploy with "Could not find rules for the following
          # storage targets: rules".
          npx --yes --package "$FIREBASE_TOOLS" -- firebase deploy \
            --only functions,firestore,storage \
            --project "$PROJECT_ID" \
            --force \
            --non-interactive

      # The web-sized images are generated rather than committed, so the deploy has to
      # produce them or the site ships with no photographs at all. Two of the three sizes:
      # thumbnails to browse with (78 MB), and the 1200x630 cards that link previews need
      # (280 MB), against 693 MB for all three - and hosting keeps every version. The
      # detail page falls back to the thumbnail when the 1400 px file is absent, so every
      # photograph still shows, just not at full size.
      - name: Build the website
        if: env.TARGETS != 'backend'
        run: |
          npm run thumbs -- --only=thumb,social
          npm run build

      - name: Deploy the website
        if: env.TARGETS != 'backend'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F }}
          channelId: live
          projectId: gzvka-12a9f

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
