name: Deploy to Firebase Hosting on PR

on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up environment variables
        run: |
          # The two hosting workflows referred to two different secret names,
          # VITE_BASE_URL_GF_PROD and VITE_BASE_URL_GF_PRD. A missing secret is not an
          # error in Actions - it expands to an empty string - so whichever workflow named
          # the one that does not exist has been silently deploying a build with no backend
          # URL, exactly the failure this branch fixes locally. Accept either spelling.
          echo "VITE_BASE_URL_GF=${{ secrets.VITE_BASE_URL_GF_PROD || secrets.VITE_BASE_URL_GF_PRD }}" >> $GITHUB_ENV

          # The curator's page needs these three or it cannot even offer a sign-in button.
          # They are not secrets - Firebase publishes them in every client app - but they
          # are kept as repository secrets so the project can be pointed somewhere else
          # without a commit. Unset, the page says so plainly rather than half-working.
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> $GITHUB_ENV

      - run: npm ci
      - run: npm ci --prefix functions

      # The same gates the merge workflow runs, run here first.
      #
      # Merging is what deploys, and what it deploys now includes twenty live functions, so
      # a red test has to be visible on the pull request rather than at the moment the
      # rollout starts. Nothing was checked here at all before that was true.
      - name: Run the tests
        run: npm test --prefix functions

      - name: Check the types
        run: |
          # `.svelte-kit` is generated, not committed, and `svelte-check` without it hangs
          # rather than failing. See the note in the merge workflow.
          npx svelte-kit sync
          npx svelte-check --threshold error
          npm run build --prefix functions

      # The web-sized images are generated rather than committed, so the deploy has to
      # produce them or the site ships with no photographs at all. Two of the three sizes:
      # thumbnails to browse with (78 MB), and the 1200x630 cards that link previews need
      # (280 MB), against 693 MB for all three - and hosting keeps every version. The
      # detail page falls back to the thumbnail when the 1400 px file is absent, so every
      # photograph still shows, just not at full size.
      - run: npm run thumbs -- --only=thumb,social
      - run: npm run build

      # Hosting only, and there is no preview for the rest: functions, rules and indexes
      # have one live copy per project. So a preview shows the new website talking to the
      # backend that is deployed today, which is worth knowing but is not the whole change -
      # anything touching `functions/` is only really exercised after the merge.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F }}
          projectId: gzvka-12a9f
