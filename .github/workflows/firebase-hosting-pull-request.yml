name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up environment variables
        run: |
          echo "VITE_BASE_URL_GF=${{ secrets.VITE_BASE_URL_GF_PRD }}" >> $GITHUB_ENV

      # The web-sized images are generated rather than committed, so the deploy has to
      # produce them or the site ships with no photographs at all. Thumbnails only: they
      # come to 78 MB where both sizes come to 443 MB, and hosting keeps every version.
      - run: npm ci
      - run: npm run thumbs -- --only=thumb
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GZVKA_12A9F }}
          projectId: gzvka-12a9f
